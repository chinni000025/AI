name: Build AI Engine

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: AIEngineClient/package-lock.json

    - name: Install Client Dependencies
      working-directory: AIEngineClient
      run: npm ci
        
    - name: Build Application
      run: .\build.cmd all Release
