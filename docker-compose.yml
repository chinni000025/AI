version: '3.8'

services:
  ai-engine-host:
    image: ai-engine-host:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_engine_host
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Logging__LogLevel__Default=Information
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ai_engine_data:/var/lib/AIEngine
      - ai_engine_logs:/var/log/AIEngine
    restart: unless-stopped

volumes:
  ai_engine_data:
  ai_engine_logs:
