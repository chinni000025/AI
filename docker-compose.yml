version: '3.8'

services:
  ai-engine-host:
    image: ai-engine-host:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_engine_host
    ports:
      - "5000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Redis__Enable=true
      - Redis__ConnectionString=ai_engine_redis:6379,abortConnect=false,connectRetry=5
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ai_engine_data:/var/lib/AIEngine
      - ai_engine_logs:/usr/share/AIEngine/AIEngineLogs
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai_engine_redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - ai_engine_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  ai_engine_data:
  ai_engine_logs:
  ai_engine_redis_data: