@if (visible()) {
<div class="loader-overlay" [class.loader-overlay--hide]="!config()">
	<div class="loader-card">

		<!-- Neural Pulse Animation -->
		<div class="neural-stage">

			<!-- Orbiting rings -->
			<div class="ring ring--1"></div>
			<div class="ring ring--2"></div>
			<div class="ring ring--3"></div>

			<!-- Floating particles -->
			<div class="particle particle--1"></div>
			<div class="particle particle--2"></div>
			<div class="particle particle--3"></div>
			<div class="particle particle--4"></div>
			<div class="particle particle--5"></div>
			<div class="particle particle--6"></div>

			<!-- Glowing core -->
			<div class="core">
				<div class="core__inner">
					<app-svg-brand-logo [width]="'24px'" [height]="'24px'"></app-svg-brand-logo>
				</div>
				<div class="core__glow"></div>
			</div>
		</div>

		<!-- Message -->
		<div class="loader-message">
			<span class="loader-message__text">{{ config()!.message || 'Loading' }}</span>
			<span class="loader-message__dots">
				<span></span><span></span><span></span>
			</span>
		</div>

	</div>
</div>
}
