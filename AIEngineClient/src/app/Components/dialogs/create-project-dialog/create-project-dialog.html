<div class="cpd-backdrop" (click)="closeDialog()">
  <section class="cpd-panel" role="dialog" aria-modal="true" aria-labelledby="createProjectTitle"
    (click)="$event.stopPropagation()">

    <!-- Header -->
    <header class="cpd-header">
      <div class="cpd-header__main">
        <div class="cpd-header__text">
          <div class="cpd-header__title-row">
            <h2 class="cpd-header__title" id="createProjectTitle">Create New Project</h2>
          </div>
          <p class="cpd-header__subtitle">
            Group conversations, set custom persona instructions, and attach reference knowledge files.
          </p>
        </div>
      </div>

      <button type="button" class="cpd-close-btn" (click)="closeDialog()" title="Cancel and close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <!-- Dialog Body (Scrollable form) -->
    <div class="cpd-body">
      <!-- Identity: Name & Description -->
      <div class="cpd-section">
        <div class="cpd-form-group">
          <label class="cpd-label" for="projName">
            Project Name <span class="cpd-required">*</span>
          </label>
          <input id="projName" type="text" class="cpd-input"
            placeholder="e.g. Enterprise RAG Pipeline, Marketing Copywriter..." [(ngModel)]="projectName" maxlength="80"
            autofocus />
          @if (nameError) {
          <span class="cpd-field-error">{{ nameError }}</span>
          }
        </div>

        <div class="cpd-form-group">
          <label class="cpd-label" for="projDesc">
            Description <span class="cpd-optional">(optional)</span>
          </label>
          <textarea id="projDesc" class="cpd-textarea cpd-textarea--short"
            placeholder="Briefly describe what this project workspace is focused on..." [(ngModel)]="projectDescription"
            maxlength="300" rows="2"></textarea>
        </div>
      </div>
    </div>

    <!-- Footer Actions -->
    <footer class="cpd-footer">

      <div class="cpd-footer__actions">
        <button type="button" class="cpd-btn cpd-btn--ghost" (click)="closeDialog()">
          Cancel
        </button>
        <button type="button" class="cpd-btn cpd-btn--primary" [disabled]="!projectName.trim()"
          (click)="submitCreateProject()">
          <span class="cpd-btn__icon"></span>
          <span>Create Project</span>
        </button>
      </div>
    </footer>
  </section>
</div>
