<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" [style.width]="width" [style.height]="height">
  <defs>
    <!-- Facet 1: Cyan-Blue Aurora Gradient -->
    <linearGradient id="edDriveFacetTop" x1="6" y1="4" x2="26" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>

    <!-- Facet 2: Deep Blue-Indigo Gradient -->
    <linearGradient id="edDriveFacetRight" x1="16" y1="12" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0072ff" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Facet 3: Bright Teal-Electric Gradient -->
    <linearGradient id="edDriveFacetLeft" x1="4" y1="14" x2="16" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0066eb" />
    </linearGradient>

    <!-- Central Glowing Core Gradient -->
    <linearGradient id="edDriveCoreGlow" x1="12" y1="12" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <!-- Subtle Drop Filter -->
    <filter id="edCoreGlowFilter" x="8" y="8" width="16" height="16" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Top Sector (Cloud / Ingestion Wing) -->
  <path d="M16 3.5L27 9.8C27.6 10.1 27.8 10.8 27.5 11.4L22.2 20.6C21.9 21.1 21.2 21.4 20.6 21.1L16 18.5L16 3.5Z" 
        fill="url(#edDriveFacetTop)" />

  <!-- Left Sector (Local Storage / Cache Wing) -->
  <path d="M16 3.5L16 18.5L11.4 21.1C10.8 21.4 10.1 21.1 9.8 20.6L4.5 11.4C4.2 10.8 4.4 10.1 5 9.8L16 3.5Z" 
        fill="url(#edDriveFacetLeft)" />

  <!-- Bottom Sector (Vector Neural Index / Storage Platter) -->
  <path d="M9.8 20.6L16 17L22.2 20.6C22.7 20.9 22.9 21.6 22.6 22.1L18.5 28.3C18.1 28.9 17.3 29.2 16.6 28.8L15.4 28.8C14.7 29.2 13.9 28.9 13.5 28.3L9.4 22.1C9.1 21.6 9.3 20.9 9.8 20.6Z" 
        fill="url(#edDriveFacetRight)" />

  <!-- High-Tech Inner Facet Dividers & Energy Seams -->
  <path d="M16 4.5V17M16 17L6 11.5M16 17L26 11.5M16 17L10.5 25M16 17L21.5 25" 
        stroke="#060913" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.65" />

  <!-- Glowing Central AI Engine Core -->
  <circle cx="16" cy="16" r="4.6" fill="#060913" stroke="#00f0ff" stroke-width="1.2" />
  <circle cx="16" cy="16" r="3.2" fill="url(#edDriveCoreGlow)" filter="url(#edCoreGlowFilter)" />
  <circle cx="16" cy="16" r="1.3" fill="#ffffff" />

  <!-- Peripheral Turbine Accents / Optical Data Points -->
  <circle cx="16" cy="7" r="0.9" fill="#ffffff" opacity="0.9" />
  <circle cx="23.5" cy="14" r="0.9" fill="#ffffff" opacity="0.9" />
  <circle cx="8.5" cy="14" r="0.9" fill="#ffffff" opacity="0.9" />
</svg>
